services:
  postgres:
    image: postgres:16
    container_name: robot-postgres
    command:
      - postgres
      - -c
      - log_statement=all
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - robot-postgres-data:/var/lib/postgresql/data
volumes:
  robot-postgres-data: